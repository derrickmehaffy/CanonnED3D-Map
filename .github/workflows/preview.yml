# Preview builds, for showing work to people before it becomes a pull request.
#
# Deliberately NOT the deploy in mainl.yml. That one writes
#     echo "map.canonn.tech" > CNAME
# into the published tree, which is right for canonn-science/CanonnED3D-Map and
# actively dangerous anywhere else: a fork publishing that CNAME asks GitHub to
# bind the live map's domain to the fork's Pages site. Unless the domain is
# verified on the owning org, that can break — or take over — the real site.
#
# So this workflow publishes no CNAME at all. A preview lives at
# https://<owner>.github.io/<repo>/ and nowhere else.
#
# And it only runs on a fork — see the guard on the job. The two deploys use
# Pages modes that cannot coexist: canonn-science/CanonnED3D-Map serves
# build_type "legacy" from the gh-pages branch that mainl.yml force-pushes,
# while this one needs build_type "workflow". Upstream it would fail red rather
# than deploy, which is noise nobody asked for; worse, a workflow on the default
# branch gets a Run button, and the day Pages there is switched to "GitHub
# Actions" that button would publish a CNAME-less build over map.canonn.tech and
# take the custom domain and its certificate with it.
#
# It is scoped to the working branch and nothing else. GitHub only offers
# workflow_dispatch for workflows that exist on the default branch, and putting
# this on master would fire mainl.yml — the very deploy being avoided — so the
# branch trigger is what makes a preview possible without touching master at
# all. Adding a branch here is how you preview a different one.
name: Preview build

on:
  push:
    branches:
      - modernization
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to publish
        required: false

# One preview at a time; a newer run replaces an older one rather than racing it.
concurrency:
  group: pages-preview
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    # Previews are a fork thing. Keyed on being a fork rather than on the
    # upstream's name, so a rename or a transfer cannot quietly un-guard it,
    # and so anyone who forks this gets previews of their own. A missing key
    # reads as false, which errs towards not deploying.
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatched with a ref, or whatever branch was just pushed.
          ref: ${{ inputs.ref || github.ref }}

      # Belt and braces: fail loudly rather than publish a domain claim, even
      # if someone later adds a CNAME under Source/.
      - name: Refuse to publish a custom domain
        run: |
          if [ -e Source/CNAME ]; then
            echo "Source/CNAME exists — a preview must not claim a custom domain." >&2
            exit 1
          fi

      # Through env, not interpolated into the command: a dispatch input is
      # still someone's text, and text does not belong in a shell line.
      - name: Say which build this is
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' \
            "Preview build" \
            "ref:    $REF" \
            "commit: $SHA" \
            "built:  $(date -u +'%Y-%m-%d %H:%M UTC')" > Source/PREVIEW.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./Source
      - id: deploy
        uses: actions/deploy-pages@v4
