<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canonn Map Console — prototype</title>
<link rel="icon" type="image/x-icon" href="../img/favicon.ico">
<!-- lcunfool's nav arrows use Font Awesome glyphs; without this they render blank. -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
<style>
:root{
  --void:#05070A; --panel:#0C1116; --panel-2:#111820; --rule:#1B242E;
  --amber:#FF9D00; --ion:#4DE3E1; --text:#CAD4DC; --dim:#6B7986; --dimmer:#414E5A;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',ui-sans-serif,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--sans);
  font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input[type=range]{accent-color:var(--amber)}
.app{display:grid;grid-template-rows:44px 1fr 30px;height:100vh}

/* top */
.top{display:flex;align-items:center;gap:12px;padding:0 12px;
  border-bottom:1px solid var(--rule);background:var(--panel);z-index:30}
.top .mark{width:19px;height:19px;flex:none}
.switch{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);
  padding:5px 10px;font-family:var(--cond);font-size:13px;font-weight:600}
.switch:hover{border-color:var(--amber);color:var(--amber)}
.switch .ch{color:var(--dimmer);font-size:9px}
.find{flex:1;max-width:400px;display:flex;align-items:center;gap:9px;
  border:1px solid var(--rule);padding:5px 11px;color:var(--dimmer);
  font-family:var(--mono);font-size:12px}
.find:hover{border-color:var(--dim)}
.find .k{margin-left:auto;border:1px solid var(--rule);padding:1px 5px;font-size:9.5px}
.top .sp{flex:1}
.feed{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}
.feed .d{width:6px;height:6px;border-radius:50%;background:var(--dimmer)}
.feed.live .d{background:#5FD08A;box-shadow:0 0 6px #5FD08A}
.feed.snapshot .d{background:var(--amber)}
.toprail{display:flex;align-items:stretch;gap:0;border:1px solid var(--rule)}
.toprail .tb{display:flex;align-items:center;gap:6px;padding:5px 11px;
  font-family:var(--cond);font-size:12px;font-weight:600;color:var(--dim);
  text-decoration:none;white-space:nowrap}
.toprail .tb + .tb{border-left:1px solid var(--rule)}
.toprail .tb:hover{color:var(--ion)}
.toprail .tb.donate{color:var(--amber)}
.toprail .tb.donate:hover{background:var(--amber);color:#0B0700}

/* body */
.mid{display:flex;min-height:0;position:relative}
.rail{width:56px;flex:none;background:var(--panel);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;z-index:20}
.rail button{width:42px;height:42px;display:grid;place-items:center;color:var(--dim);font-size:17px;line-height:1}
.rail button:hover{color:var(--text);background:var(--panel-2)}
.rail button.on{color:var(--amber);background:var(--panel-2);box-shadow:inset 2px 0 0 var(--amber)}
.side{width:258px;flex:none;background:var(--panel);border-right:1px solid var(--rule);
  overflow-y:auto;padding:13px;z-index:20}
.side.hidden{display:none}
.s-t{font-family:var(--cond);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dimmer);margin-bottom:4px}
.s-sub{font-family:var(--mono);font-size:10px;color:var(--dimmer);margin-bottom:11px}
.s-sub b{color:var(--amber);font-weight:500}
.grp{margin-top:15px}
.grp:first-child{margin-top:0}

.layer{display:flex;align-items:center;gap:9px;padding:5px 5px;cursor:pointer;
  border-left:2px solid transparent}
.layer:hover{background:var(--panel-2)}
.layer.sel{background:var(--panel-2);border-left-color:var(--amber)}
.layer .sw{width:10px;height:10px;flex:none;border-radius:1px}
.layer .nm{flex:1;font-family:var(--mono);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.layer .ct{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);font-variant-numeric:tabular-nums}
.layer.off{opacity:.4}
.layer.off .sw{background:transparent!important;box-shadow:inset 0 0 0 1px var(--dim)}
.note{margin-top:11px;padding:9px 10px;border:1px solid var(--rule);background:#080C10;
  font-family:var(--mono);font-size:10px;color:var(--dimmer);line-height:1.6}
.note b{color:var(--text);font-weight:500}
.tmpl{margin-top:12px;border:1px solid var(--rule);background:#080C10}
.tmpl-h{padding:8px 10px;border-bottom:1px solid var(--rule);font-family:var(--cond);
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer);
  display:flex;justify-content:space-between;align-items:center}
.tmpl-h b{color:var(--amber);font-weight:600}
.tmpl img{display:block;width:100%;height:auto;background:#0C1116}
.tmpl-f{padding:7px 10px;font-family:var(--mono);font-size:10px;color:var(--dimmer);
  border-top:1px solid var(--rule);line-height:1.5}

.sysfilter{width:100%;background:var(--panel-2);border:1px solid #24303B;color:var(--text);
  font-family:var(--mono);font-size:11.5px;padding:6px 9px;outline:none;margin-bottom:2px}
.sysfilter:focus{border-color:var(--amber)}
.sysfilter::placeholder{color:var(--dimmer)}
.syssort{display:flex;gap:4px;margin:7px 0 4px}
.syssort button{flex:1;border:1px solid var(--rule);padding:4px 6px;font-family:var(--cond);
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.syssort button.on{border-color:var(--amber);color:var(--amber)}
.syslist{margin:0 -13px}
.sysrow{display:flex;align-items:center;gap:8px;padding:6px 13px;cursor:pointer;
  border-left:2px solid transparent}
.sysrow:hover{background:var(--panel-2)}
.sysrow.on{background:var(--panel-2);border-left-color:var(--amber)}
.sysrow .wedge{display:flex;flex:none;gap:2px}
.sysrow .wedge i{width:6px;height:6px;border-radius:1px;display:block}
.sysrow .nm{flex:1;min-width:0;font-family:var(--mono);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysrow .nm mark{background:none;color:var(--amber);font-weight:600}
.sysrow .ly{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);flex:none;
  font-variant-numeric:tabular-nums}
.sysrow.dim{opacity:.35}
.row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px}
.row .lb{flex:1;color:var(--text)}
.row .vv{font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.btnrow button{border:1px solid var(--rule);padding:6px 8px;font-size:11.5px;color:var(--text)}
.btnrow button:hover{border-color:var(--ion);color:var(--ion)}
.sw-t{position:relative;width:32px;height:17px;border:1px solid var(--rule);flex:none;cursor:pointer}
.sw-t::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;
  background:var(--dim);transition:left .12s,background .12s}
.sw-t.on{border-color:var(--amber)}
.sw-t.on::after{left:17px;background:var(--amber)}
.drop{margin-top:8px;border:1px dashed var(--rule);padding:16px 12px;text-align:center;
  font-family:var(--mono);font-size:10.5px;color:var(--dimmer);cursor:pointer;line-height:1.6}
.drop:hover,.drop.over{border-color:var(--amber);color:var(--text)}

/* stage — the REAL Ed3d canvas lives here */
.stage{flex:1;position:relative;min-width:0;background:var(--void)}
#edmap{position:absolute;inset:0}
#edmap #ed3dmap{width:100%;height:100%}
/* lcunfool's zoom + pan cluster, kept and restyled rather than replaced.
   Its handlers are bound by HUD.initHudAction(), which runs even with
   withHudPanel:false, so the buttons work as they always did. */
#nav-controls{position:absolute;right:12px;bottom:12px;z-index:8;
  display:flex;flex-direction:column;align-items:center;gap:6px}
#nav-controls .nav-zoom{display:flex;flex-direction:column;gap:4px}
#nav-controls .nav-pan{display:flex;flex-direction:column;align-items:center;gap:4px}
#nav-controls .nav-pan-row{display:flex;gap:4px}
#nav-controls .nav-btn{width:28px;height:28px;border:1px solid var(--rule);
  background:var(--panel);color:var(--dim);display:grid;place-items:center;
  font-size:12px;cursor:pointer;text-decoration:none}
#nav-controls .nav-btn:hover{border-color:var(--amber);color:var(--amber)}
/* Boot screen. Keeps id="loading" because all 35 MapData-*.js files dismiss the
   overlay themselves with document.getElementById('loading').style.display='none'.
   A MutationObserver (console.js) turns that abrupt hide into a fade. */
#loading{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:58px;background:var(--void);
  transition:opacity .5s ease}
#loading.done{opacity:0}
/* rd-banner is a 1600x400 banner with the atom centred in a lot of empty
   canvas, so it reads small at full width. Scaling the SVG up rather than
   widening the box keeps the limpets' fly-in on screen; the extra gap below
   leaves room for the overflow. */
#bootlogo{width:min(760px,72vw);aspect-ratio:4/1;
  /* clip left/right at the box edge so stray limpets parked out at the banner's
     far ends are cropped, while letting the scaled atom overflow vertically */
  clip-path:inset(-100% 0 -100% 0)}
#bootlogo svg{display:block;width:100%;height:100%;transform:scale(1.55)}
/* Shown only if bodymovin fails or the JSON 404s */
#bootfallback{display:none;font-family:var(--cond);font-size:26px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
#loading.nolottie #bootlogo{display:none}
#loading.nolottie #bootfallback{display:block}
#bootbar{width:min(320px,50vw);height:2px;background:var(--rule);overflow:hidden}
#bootbar i{display:block;height:100%;width:35%;background:var(--amber);
  animation:bootsweep 1.15s cubic-bezier(.6,0,.35,1) infinite}
@keyframes bootsweep{0%{transform:translateX(-100%)}100%{transform:translateX(386%)}}
#bootmsg{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);min-height:1em}
#bootmsg b{color:var(--ion);font-weight:400}
@media (prefers-reduced-motion:reduce){
  #loading{transition:none}
  #bootbar i{animation:none;width:100%}
}
.hint{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10.5px;
  color:var(--dimmer);pointer-events:none;line-height:1.7;z-index:6}
.viewmode{position:absolute;right:12px;top:12px;display:flex;border:1px solid var(--rule);
  background:var(--panel);z-index:8}
.viewmode button{padding:5px 12px;font-family:var(--cond);font-size:11.5px;font-weight:600;
  letter-spacing:.06em;color:var(--dim)}
.viewmode button + button{border-left:1px solid var(--rule)}
.viewmode button.on{background:var(--amber);color:#0B0700}
.viewmode button:not(.on):hover{color:var(--text)}

/* card */
.card{position:absolute;right:12px;top:46px;width:280px;background:var(--panel);
  border:1px solid var(--rule);box-shadow:0 8px 28px rgba(0,0,0,.6);z-index:9;
  max-height:calc(100% - 170px);overflow-y:auto}
.card.hidden{display:none}
.c-h{padding:11px 13px;border-bottom:1px solid var(--rule);display:flex;
  justify-content:space-between;align-items:flex-start;gap:8px}
.c-h .n{font-family:var(--cond);font-size:15.5px;font-weight:600;color:#E4EBF1;line-height:1.25}
.c-h .x{color:var(--dimmer);font-size:15px;line-height:1;flex:none}
.c-h .x:hover{color:var(--text)}
.c-meta{padding:9px 13px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);
  line-height:1.7;border-bottom:1px solid var(--rule)}
.c-sec{padding:10px 13px 4px;font-family:var(--cond);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dimmer);display:flex;justify-content:space-between;gap:8px}
.c-sec b{color:var(--amber);font-weight:600;text-align:right}
.site{display:flex;align-items:center;gap:9px;padding:6px 13px;cursor:pointer;
  border-left:2px solid transparent}
.site:hover{background:var(--panel-2)}
.site.on{background:var(--panel-2);border-left-color:var(--amber)}
.site .sw{width:9px;height:9px;flex:none;border-radius:1px}
.site .ty{font-family:var(--cond);font-size:12.5px;font-weight:600}
.site .bd{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);margin-left:auto}
.c-tmpl{padding:9px 13px 11px}
.c-tmpl img{display:block;width:100%;border:1px solid var(--rule);background:#080C10}
.c-tmpl .cap{font-family:var(--mono);font-size:10px;color:var(--dimmer);margin-top:6px;line-height:1.5}
.c-link{margin:0 13px 10px;padding:8px 10px;border:1px solid var(--rule);background:#080C10;
  font-family:var(--mono);font-size:10px;color:var(--dimmer);line-height:1.6}
.c-link a{color:var(--ion);text-decoration:none;border-bottom:1px solid rgba(77,227,225,.3)}
.c-acts{padding:0 13px 13px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.c-acts a,.c-acts button{display:flex;align-items:center;gap:6px;padding:6px 9px;
  border:1px solid var(--rule);font-size:11.5px;color:var(--text);text-decoration:none}
.c-acts a:hover,.c-acts button:hover{border-color:var(--ion);color:var(--ion)}
.c-acts .ax{margin-left:auto;color:var(--dimmer);font-size:9px}
.c-acts a.wide{grid-column:1/-1;border-color:var(--amber-dim,#8A5600);color:var(--amber);
  font-weight:600;justify-content:flex-start}
.c-acts a.wide:hover{background:var(--amber);color:#0B0700;border-color:var(--amber)}
.c-acts a.wide .ax{color:inherit}

/* strip */
.strip{display:flex;align-items:stretch;border-top:1px solid var(--rule);
  background:var(--panel);font-family:var(--mono);font-size:11px;z-index:30}
.strip .cell{padding:0 13px;display:flex;align-items:center;gap:7px;border-right:1px solid var(--rule)}
.strip .cell.end{border-right:0;margin-left:auto}
.strip .lb{color:var(--dimmer);font-size:9px;letter-spacing:.09em;text-transform:uppercase}
.strip .vl{color:var(--text);font-variant-numeric:tabular-nums}
.strip .vl.ion{color:var(--ion)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(3,5,8,.78);display:none;z-index:60}
.scrim.open{display:flex}
.scrim.pal-scrim{align-items:flex-start;justify-content:center;padding-top:12vh}
.pal{width:min(600px,92vw);background:var(--panel);border:1px solid var(--rule);
  box-shadow:0 24px 70px rgba(0,0,0,.7)}
.pal-in{display:flex;align-items:center;gap:11px;padding:0 15px;border-bottom:1px solid var(--rule)}
.pal-in .cr{color:var(--amber);font-family:var(--mono)}
#pq{flex:1;background:none;border:0;outline:none;color:var(--text);
  font-family:var(--mono);font-size:15px;padding:14px 0}
#pq::placeholder{color:var(--dimmer)}
.pal-res{max-height:46vh;overflow-y:auto;padding:6px}
.pg{font-family:var(--cond);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dimmer);padding:11px 8px 5px}
.pr{display:flex;align-items:center;gap:11px;padding:8px 9px;cursor:pointer;
  border-left:2px solid transparent}
.pr[aria-selected="true"]{background:var(--panel-2);border-left-color:var(--amber)}
.pr .ic{width:15px;text-align:center;color:var(--dim);font-size:11px;flex:none}
.pr.ext .ic{color:var(--ion)}
.pr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .nm mark{background:none;color:var(--amber);font-weight:600}
.pr .mt{font-family:var(--mono);font-size:10px;color:var(--dimmer);flex:none}
.pal-foot{padding:8px 15px;border-top:1px solid var(--rule);font-family:var(--mono);
  font-size:10px;color:var(--dimmer);display:flex;gap:16px;flex-wrap:wrap}
.pal-empty{padding:22px 10px;font-family:var(--mono);font-size:12px;color:var(--dimmer)}

/* map index — the browsable alternative to searching */
.scrim.idx-scrim{align-items:stretch;justify-content:center;padding:5vh 4vw}
.idx{width:100%;max-width:1080px;background:var(--panel);border:1px solid var(--rule);
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.7)}
.idx-h{padding:15px 20px;border-bottom:1px solid var(--rule);display:flex;
  align-items:baseline;gap:14px}
.idx-h h2{margin:0;font-family:var(--cond);font-size:19px;font-weight:700;color:#E4EBF1}
.idx-h .sub{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.idx-h .x{margin-left:auto;color:var(--dimmer);font-size:20px;line-height:1}
.idx-h .x:hover{color:var(--text)}
.idx-b{overflow-y:auto;padding:6px 20px 20px}
.idx-g{margin-top:18px}
.idx-gt{font-family:var(--cond);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);padding:8px 0;border-bottom:1px solid var(--rule);margin-bottom:10px}
.idx-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:6px}
.idx-i{border:1px solid var(--rule);padding:10px 12px;text-align:left;display:block;
  text-decoration:none;color:inherit}
.idx-i:hover{border-color:var(--amber);background:var(--panel-2)}
.idx-i .n{font-family:var(--cond);font-size:13.5px;font-weight:600;color:var(--text)}
.idx-i .d{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.idx-i .s{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  margin-top:7px;color:var(--dimmer)}
.idx-i.live{border-color:#24404E}
.idx-i.live .s{color:#5FD08A}
.idx-i.cur{border-color:var(--amber)}
.idx-i.cur .s{color:var(--amber)}
@media(max-width:820px){
  .side{position:absolute;left:44px;top:0;bottom:0}
  .card{width:calc(100% - 24px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#FF9D00" stroke-width="2.4"/>
      <ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#FF9D00" stroke-width="2.4" transform="rotate(60 20 20)"/>
      <ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#FF9D00" stroke-width="2.4" transform="rotate(120 20 20)"/>
      <circle cx="20" cy="20" r="5" fill="#FF9D00"/>
    </svg>
    <button class="switch" id="switcher" title="Browse all maps">
      <span id="mapname">Guardian Ruins</span> <span class="ch">&#9662;</span></button>
    <button class="find" id="findbtn">Find anything <span class="k">&#8984;K</span></button>
    <span class="sp"></span>
    <span class="feed" id="feed"><span class="d"></span><span id="feedtxt">loading&#8230;</span></span>
    <div class="toprail">
      <button class="tb" id="toolsbtn" title="Canonn tools">&#8862; Tools</button>
      <a class="tb" href="https://github.com/canonn-science/CanonnED3D-Map" target="_blank"
         rel="noopener" title="Source on GitHub">GitHub</a>
      <a class="tb donate" href="https://canonn.science/donate/" target="_blank"
         rel="noopener" title="Support Canonn">Donate</a>
    </div>
  </div>

  <div class="mid">
    <div class="rail">
      <button class="on" data-p="layers" title="Layers" aria-label="Layers"><i class="fa fa-filter"></i></button>
      <button data-p="systems" title="Systems on this map" aria-label="Systems on this map"><i class="fa fa-list"></i></button>
      <button data-p="camera" title="Camera" aria-label="Camera"><i class="fa fa-crosshairs"></i></button>
      <button data-p="routes" title="Routes &amp; journals" aria-label="Routes and journals"><i class="fa fa-location-arrow"></i></button>
      <button data-p="display" title="Display" aria-label="Display"><i class="fa fa-adjust"></i></button>
    </div>
    <aside class="side" id="side"></aside>

    <div class="stage">
      <div id="edmap"><div id="loading" role="status" aria-live="polite">
        <div id="bootlogo"></div>
        <div id="bootfallback">Canonn R&amp;D</div>
        <div id="bootbar"><i></i></div>
        <p id="bootmsg">Initialising</p>
      </div></div>
      <div class="viewmode" role="group" aria-label="View mode">
